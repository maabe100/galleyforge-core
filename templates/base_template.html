<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ TITLE }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
      line-height: 1.6;
    }
    h1, h2 {
      font-weight: 600;
    }
    figure {
      margin: 1.5rem 0;
    }
    figure img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    figcaption, caption {
      font-size: 0.9rem;
      color: #555;
    }
    caption {
      text-align: left;
      padding-bottom: 0.4rem;
    }
    table {
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    th, td {
      border: 1px solid #bbb;
      padding: 0.3rem 0.7rem;
      text-align: left;
    }
    .no-image {
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>
  {{ BODY }}
</body>
</html>
